name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCOMETTEXTEL_BUILD_SHARED=ON
          -DCOMETTEXTEL_BUILD_STATIC=ON
          -DCOMETTEXTEL_BUILD_TESTS=ON
          -DCOMETTEXTEL_BUILD_EXAMPLES=ON
          -DCOMETTEXTEL_BUILD_DOCS=OFF
          -DCOMETTEXTEL_BUILD_C_API=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60

      - name: Stage artifacts
        shell: pwsh
        run: |
          $out = "artifact/comettextel-windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/bin", "$out/lib", "$out/include" | Out-Null
          Copy-Item "build/Release/comettextel.dll" "$out/bin/"
          Copy-Item "build/Release/comettextel.lib" "$out/lib/"
          Copy-Item "build/Release/comettextel_static.lib" "$out/lib/"
          Copy-Item -Recurse "include/comettextel" "$out/include/"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$out/" }
          if (Test-Path README.md) { Copy-Item README.md "$out/" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: comettextel-windows-x64
          path: artifact/comettextel-windows-x64
          if-no-files-found: error
          retention-days: 14

      - name: Stage C SDK
        shell: pwsh
        run: |
          ./scripts/stage_c_sdk.ps1 -OutDir "artifact/comettextel-c-sdk-windows-x64" -BuildDir build -Configuration Release

      - name: Upload C SDK (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: comettextel-c-sdk-windows-x64
          path: artifact/comettextel-c-sdk-windows-x64
          if-no-files-found: error
          retention-days: 14

      - name: Python SDK tests
        shell: pwsh
        run: |
          $env:COMETTEXTEL_LIB = (Resolve-Path "artifact/comettextel-c-sdk-windows-x64/bin/comettextel.dll").Path
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest sdk/python -q

      - name: Python wheel (win_amd64)
        shell: pwsh
        run: |
          python -m pip install build
          python sdk/python/scripts/stage_native.py --from artifact/comettextel-c-sdk-windows-x64
          New-Item -ItemType Directory -Force -Path artifact/wheels | Out-Null
          python -m build --wheel --outdir artifact/wheels sdk/python
          python sdk/python/scripts/stage_native.py --clean

      - name: Upload Python wheel (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: comettextel-python-wheel-windows
          path: artifact/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: .NET PDU smoke tests
        shell: pwsh
        run: |
          $lib = "nuget/CometTextel.NET/CometTextel.NET/Lib"
          New-Item -ItemType Directory -Force -Path "$lib/win-x64" | Out-Null
          Copy-Item "build/Release/comettextel.dll" "$lib/win-x64/comettextel.dll" -Force
          Copy-Item "build/Release/comettextel.dll" "$lib/comettextel.dll" -Force
          dotnet test "nuget/CometTextel.NET/CometTextel.NET.Tests/CometTextel.NET.Tests.csproj" `
            -c Release -p:Platform=x64 --verbosity normal

      - name: Upload NuGet win-x64 native
        uses: actions/upload-artifact@v4
        with:
          name: nuget-native-win-x64
          path: nuget/CometTextel.NET/CometTextel.NET/Lib/win-x64/comettextel.dll
          if-no-files-found: error
          retention-days: 14

  linux-gcc:
    name: Linux (GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCOMETTEXTEL_BUILD_SHARED=ON
          -DCOMETTEXTEL_BUILD_STATIC=ON
          -DCOMETTEXTEL_BUILD_TESTS=ON
          -DCOMETTEXTEL_BUILD_EXAMPLES=ON
          -DCOMETTEXTEL_BUILD_DOCS=OFF
          -DCOMETTEXTEL_BUILD_C_API=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60

      - name: Stage artifacts
        run: |
          set -euo pipefail
          out=artifact/comettextel-linux-x64
          mkdir -p "$out/lib" "$out/include"
          find build -maxdepth 3 -type f \( -name 'libcomettextel.so*' -o -name 'libcomettextel.a' \) -exec cp -a {} "$out/lib/" \;
          test -n "$(find "$out/lib" -type f | head -n 1)"
          cp -a include/comettextel "$out/include/"
          [ -f LICENSE ] && cp LICENSE "$out/"
          [ -f README.md ] && cp README.md "$out/"
          ls -la "$out/lib"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: comettextel-linux-x64
          path: artifact/comettextel-linux-x64
          if-no-files-found: error
          retention-days: 14

      - name: Stage C SDK
        run: |
          chmod +x scripts/stage_c_sdk.sh
          ./scripts/stage_c_sdk.sh --out artifact/comettextel-c-sdk-linux-x64 --build-dir build

      - name: Upload C SDK (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: comettextel-c-sdk-linux-x64
          path: artifact/comettextel-c-sdk-linux-x64
          if-no-files-found: error
          retention-days: 14

      - name: Python SDK tests
        run: |
          set -euo pipefail
          libdir="artifact/comettextel-c-sdk-linux-x64/lib"
          if [[ -e "$libdir/libcomettextel.so" ]]; then
            so="$libdir/libcomettextel.so"
          else
            so="$(find "$libdir" -maxdepth 1 \( -type f -o -type l \) -name 'libcomettextel.so*' | sort | head -n 1)"
          fi
          test -n "${so:-}"
          test -e "$so"
          export COMETTEXTEL_LIB="$(realpath -e "$so")"
          echo "COMETTEXTEL_LIB=$COMETTEXTEL_LIB"
          python3 -m pip install --user pytest
          python3 -m pytest sdk/python -q

      - name: Python wheel (linux_x86_64)
        run: |
          set -euo pipefail
          python3 -m pip install --user build
          python3 sdk/python/scripts/stage_native.py --from artifact/comettextel-c-sdk-linux-x64
          mkdir -p artifact/wheels
          python3 -m build --wheel --outdir artifact/wheels sdk/python
          python3 sdk/python/scripts/stage_native.py --clean

      - name: Upload Python wheel (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: comettextel-python-wheel-linux
          path: artifact/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Stage NuGet linux-x64 native
        run: |
          set -euo pipefail
          mkdir -p nuget-native-linux-x64
          libdir="artifact/comettextel-c-sdk-linux-x64/lib"
          if [[ -e "$libdir/libcomettextel.so" ]]; then
            cp -L "$libdir/libcomettextel.so" nuget-native-linux-x64/libcomettextel.so
          else
            so="$(find "$libdir" -maxdepth 1 -type f -name 'libcomettextel.so*' | sort | head -n 1)"
            cp -L "$so" nuget-native-linux-x64/libcomettextel.so
          fi
          test -f nuget-native-linux-x64/libcomettextel.so
          ls -la nuget-native-linux-x64

      - name: Upload NuGet linux-x64 native
        uses: actions/upload-artifact@v4
        with:
          name: nuget-native-linux-x64
          path: nuget-native-linux-x64/libcomettextel.so
          if-no-files-found: error
          retention-days: 14

  pack-nuget:
    name: Pack NuGet (win-x64 + linux-x64)
    needs: [windows-msvc, linux-gcc]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download win-x64 native
        uses: actions/download-artifact@v4
        with:
          name: nuget-native-win-x64
          path: nuget/CometTextel.NET/CometTextel.NET/Lib/win-x64

      - name: Download linux-x64 native
        uses: actions/download-artifact@v4
        with:
          name: nuget-native-linux-x64
          path: nuget/CometTextel.NET/CometTextel.NET/Lib/linux-x64

      - name: Pack
        shell: pwsh
        run: |
          $proj = "nuget/CometTextel.NET/CometTextel.NET/CometTextel.NET.csproj"
          $lib = "nuget/CometTextel.NET/CometTextel.NET/Lib"
          Test-Path "$lib/win-x64/comettextel.dll"
          Test-Path "$lib/linux-x64/libcomettextel.so"
          Copy-Item "$lib/win-x64/comettextel.dll" "$lib/comettextel.dll" -Force
          New-Item -ItemType Directory -Force -Path "artifact/nuget" | Out-Null
          dotnet build $proj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack $proj -c Release -p:Platform=x64 `
            -p:CometTextelRequireLinuxNative=true `
            -o artifact/nuget --no-build

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: CometTextel.NET-nupkg
          path: artifact/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 14
