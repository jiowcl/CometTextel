name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-msvc:
    name: Build Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCOMETTEXTEL_BUILD_SHARED=ON
          -DCOMETTEXTEL_BUILD_STATIC=ON
          -DCOMETTEXTEL_BUILD_TESTS=ON
          -DCOMETTEXTEL_BUILD_EXAMPLES=ON
          -DCOMETTEXTEL_BUILD_DOCS=OFF
          -DCOMETTEXTEL_BUILD_C_API=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $name = "comettextel-$version-windows-x64"
          $out = "dist/$name"
          New-Item -ItemType Directory -Force -Path "$out/bin", "$out/lib", "$out/include" | Out-Null
          Copy-Item "build/Release/comettextel.dll" "$out/bin/"
          Copy-Item "build/Release/comettextel.lib" "$out/lib/"
          Copy-Item "build/Release/comettextel_static.lib" "$out/lib/"
          Copy-Item -Recurse "include/comettextel" "$out/include/"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$out/" }
          if (Test-Path README.md) { Copy-Item README.md "$out/" }
          Compress-Archive -Path $out -DestinationPath "dist/$name.zip" -Force

          $cName = "comettextel-$version-c-sdk-windows-x64"
          ./scripts/stage_c_sdk.ps1 -OutDir "dist/$cName" -BuildDir build -Configuration Release
          Compress-Archive -Path "dist/$cName" -DestinationPath "dist/$cName.zip" -Force

          # NuGet + Python wheel natives for the publish job
          New-Item -ItemType Directory -Force -Path "dist/nuget-native-win-x64" | Out-Null
          Copy-Item "build/Release/comettextel.dll" "dist/nuget-native-win-x64/comettextel.dll" -Force

          python -m pip install --upgrade pip build
          python sdk/python/scripts/stage_native.py --from "dist/$cName"
          New-Item -ItemType Directory -Force -Path dist/wheels | Out-Null
          python -m build --wheel --outdir dist/wheels sdk/python
          python sdk/python/scripts/stage_native.py --clean

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            dist/*.zip
            dist/wheels/*.whl
          if-no-files-found: error

      - name: Upload NuGet win-x64 native
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-native-win-x64
          path: dist/nuget-native-win-x64/comettextel.dll
          if-no-files-found: error

  linux-gcc:
    name: Build Linux (GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCOMETTEXTEL_BUILD_SHARED=ON
          -DCOMETTEXTEL_BUILD_STATIC=ON
          -DCOMETTEXTEL_BUILD_TESTS=ON
          -DCOMETTEXTEL_BUILD_EXAMPLES=ON
          -DCOMETTEXTEL_BUILD_DOCS=OFF
          -DCOMETTEXTEL_BUILD_C_API=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          name="comettextel-${version}-linux-x64"
          out="dist/${name}"
          mkdir -p "$out/lib" "$out/include"
          find build -maxdepth 3 -type f \( -name 'libcomettextel.so*' -o -name 'libcomettextel.a' \) -exec cp -a {} "$out/lib/" \;
          test -n "$(find "$out/lib" -type f | head -n 1)"
          cp -a include/comettextel "$out/include/"
          [ -f LICENSE ] && cp LICENSE "$out/"
          [ -f README.md ] && cp README.md "$out/"
          mkdir -p dist
          tar -C dist -czf "dist/${name}.tar.gz" "$name"

          c_name="comettextel-${version}-c-sdk-linux-x64"
          chmod +x scripts/stage_c_sdk.sh
          ./scripts/stage_c_sdk.sh --out "dist/${c_name}" --build-dir build
          tar -C dist -czf "dist/${c_name}.tar.gz" "$c_name"

          mkdir -p dist/nuget-native-linux-x64
          if [[ -e "dist/${c_name}/lib/libcomettextel.so" ]]; then
            cp -L "dist/${c_name}/lib/libcomettextel.so" dist/nuget-native-linux-x64/libcomettextel.so
          else
            so="$(find "dist/${c_name}/lib" -maxdepth 1 -type f -name 'libcomettextel.so*' | sort | head -n 1)"
            cp -L "$so" dist/nuget-native-linux-x64/libcomettextel.so
          fi

          python3 -m pip install --user build
          python3 sdk/python/scripts/stage_native.py --from "dist/${c_name}"
          mkdir -p dist/wheels
          python3 -m build --wheel --outdir dist/wheels sdk/python
          python3 sdk/python/scripts/stage_native.py --clean

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: |
            dist/*.tar.gz
            dist/wheels/*.whl
          if-no-files-found: error

      - name: Upload NuGet linux-x64 native
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-native-linux-x64
          path: dist/nuget-native-linux-x64/libcomettextel.so
          if-no-files-found: error

  pack-nuget:
    name: Pack NuGet (win-x64 + linux-x64)
    needs: [windows-msvc, linux-gcc]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download win-x64 native
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-native-win-x64
          path: nuget/CometTextel.NET/CometTextel.NET/Lib/win-x64

      - name: Download linux-x64 native
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-native-linux-x64
          path: nuget/CometTextel.NET/CometTextel.NET/Lib/linux-x64

      - name: Pack
        shell: pwsh
        run: |
          $proj = "nuget/CometTextel.NET/CometTextel.NET/CometTextel.NET.csproj"
          $lib = "nuget/CometTextel.NET/CometTextel.NET/Lib"
          Copy-Item "$lib/win-x64/comettextel.dll" "$lib/comettextel.dll" -Force
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          dotnet build $proj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack $proj -c Release -p:Platform=x64 `
            -p:CometTextelRequireLinuxNative=true `
            -o dist --no-build

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: release-nupkg
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows-msvc, linux-gcc, pack-nuget]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: release-assets

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: release-nupkg
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CometTextel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.whl
            release-assets/**/*.nupkg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
