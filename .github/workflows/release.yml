name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-msvc:
    name: Build Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCOMETTEXTEL_BUILD_SHARED=ON
          -DCOMETTEXTEL_BUILD_STATIC=ON
          -DCOMETTEXTEL_BUILD_TESTS=ON
          -DCOMETTEXTEL_BUILD_EXAMPLES=OFF
          -DCOMETTEXTEL_BUILD_DOCS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $name = "comettextel-$version-windows-x64"
          $out = "dist/$name"
          New-Item -ItemType Directory -Force -Path "$out/bin", "$out/lib", "$out/include" | Out-Null
          Copy-Item "build/Release/comettextel.dll" "$out/bin/"
          Copy-Item "build/Release/comettextel.lib" "$out/lib/"
          Copy-Item "build/Release/comettextel_static.lib" "$out/lib/"
          Copy-Item -Recurse "include/comettextel" "$out/include/"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$out/" }
          if (Test-Path README.md) { Copy-Item README.md "$out/" }
          Compress-Archive -Path $out -DestinationPath "dist/$name.zip" -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  linux-gcc:
    name: Build Linux (GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCOMETTEXTEL_BUILD_SHARED=ON
          -DCOMETTEXTEL_BUILD_STATIC=ON
          -DCOMETTEXTEL_BUILD_TESTS=ON
          -DCOMETTEXTEL_BUILD_EXAMPLES=OFF
          -DCOMETTEXTEL_BUILD_DOCS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          name="comettextel-${version}-linux-x64"
          out="dist/${name}"
          mkdir -p "$out/lib" "$out/include"
          find build -maxdepth 3 -type f \( -name 'libcomettextel.so*' -o -name 'libcomettextel.a' \) -exec cp -a {} "$out/lib/" \;
          test -n "$(find "$out/lib" -type f | head -n 1)"
          cp -a include/comettextel "$out/include/"
          [ -f LICENSE ] && cp LICENSE "$out/"
          [ -f README.md ] && cp README.md "$out/"
          mkdir -p dist
          tar -C dist -czf "dist/${name}.tar.gz" "$name"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows-msvc, linux-gcc]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CometTextel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
